// Read-only diagnosis of the reference packaged run; do not print process environment values.
gradle.projectsEvaluated {
    def project = gradle.rootProject
    if (!project.hasProperty('fmpPackaged')) throw new GradleException('Use only with fmpPackaged')
    project.tasks.named('runServer').configure {
        doFirst {
            def ownOutputs = project.sourceSets.main.output.files
            def paths = classpathProvider.files + classpath.files
            println "FMP_PACKAGED_DIAGNOSTIC mainOutputs=" + paths.findAll { ownOutputs.contains(it) }
            println "FMP_PACKAGED_DIAGNOSTIC jars=" + paths.findAll { it.name.startsWith('create-feed-me-packages-') }
        }
    }
}
